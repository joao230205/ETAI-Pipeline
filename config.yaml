# Pipeline configuration.
# Nothing here is hardcoded in the source files below -- everything tunable lives in this one place.

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"          # excluded from model features, used only to audit fairness
  # kept in the data but never used as model features: the row id and COMPAS's own score
  # (the redundant columns are removed earlier, by clean_dataset() -- see diagnostics.redundant_columns)
  drop_columns: ["id", "decile_score", "score_text"]
  # week 9: an external score to compare against in the fairness report (null if there is none):
  # COMPAS's own category -- anything other than "Low" counts as a "high risk" prediction
  baseline_score: {column: "score_text", negative_value: "Low", label: "COMPAS's own score"}

# Week 4: the FINAL TEST SET. Carved out once, stratified, and locked: never used to fit,
# tune, compare or choose anything. Used only for the final assessment.
# Do not change these two values after week 4 -- a new seed would silently give you a
# different (already partly "seen") test set.
test_set:
  size: 0.2
  random_state: 42

# Week 4: how models are evaluated -- stratified k-fold cross-validation on the
# development set (everything except the locked test set). Same random_state = same folds on
# every run, for every model, so comparisons are like-for-like.
cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  # Week 7: every metric here is reported for every run; the selection metric alone drives tuning
  # and the scoreboard. fbeta_<b> = F-beta (recall weighs b times precision).
  metrics: ["accuracy", "balanced_accuracy", "precision", "recall", "f1", "fbeta_2", "roc_auc", "average_precision"]
  # roc_auc: threshold-free (judges the ranking of the probabilities), unaffected by the class
  # balance, and the decision threshold stays a separate, later choice (see README)
  selection_metric: "roc_auc"
  n_jobs: 1             # folds fitted in parallel; -1 = all cores (only pays off for slow models, e.g. random forest)

# The week 3 diagnosis, written down as cleaning rules (see 01_eda_introduction.ipynb /
# JupyterNootebook_Cleaning.ipynb for how each of these was found).
# clean_dataset() in src/preprocessing.py reads everything below, so it never hardcodes COMPAS's column names.
diagnostics:
  id_column: "id"
  # columns that load as text purely because a placeholder token (see placeholder_tokens below)
  # shows up somewhere in them
  numeric_text_columns: ["priors_count", "prior_offenses"]
  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", "", "nan"]
  validity_rules:
    age: {min: 18, max: 100}
    decile_score: {min: 1, max: 10}
    juv_fel_count: {min: 0}
    # the real distribution is continuous 0-38; 250/500 (each appearing exactly 3 times) sit
    # in a hard gap above that -- sentinel values, not genuine counts (see README)
    priors_count: {min: 0, max: 60}
  # one direct lowercase-key -> canonical-label map per column: handles case/whitespace AND
  # real aliases ("felony"/"f", "african american"/"african-american") in a single step
  canonical_categories:
    sex:
      male: "Male"
      female: "Female"
    race:
      african-american: "African-American"
      african american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      other: "Other"
      asian: "Asian"
      native american: "Native American"
    c_charge_degree:
      f: "F"
      felony: "F"
      m: "M"
      misdemeanor: "M"
    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"
  # multicollinearity casualties (prior_offenses == priors_count; age_in_months == age * 12;
  # juvenile_total == sum of the 3 juvenile counters -- confirmed row by row) -- dropped by
  # clean_dataset(), so they never reach the features
  redundant_columns: ["prior_offenses", "age_in_months", "juvenile_total"]

# The preprocessing recipe (week 4). Every step here is FITTED on training rows only, inside
# the model's Pipeline. Encoder and scaler are chosen by hand (reasons below).
preprocessing:
  # options: "onehot" | "ordinal" | "count" | "target"
  encoder: "target"      # compact (1 column per feature) and informative; sklearn's version cross-fits, so no leak
  # options: "none" | "standard" | "minmax" | "robust"
  scaler: "robust"       # median/IQR: the few extreme counts (e.g. priors_count) don't set the scale for everyone
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count"]
  # age_cat excluded on purpose: Cramer's V 0.88 with age, which already carries that
  # information continuously instead of discretized -- see README "Preprocessing decisions"
  categorical_features: ["sex", "c_charge_degree"]
  # week 3 verdict: priors_count and c_charge_degree are MNAR (missingness carries information),
  # age/juv_fel_count/sex are MCAR (a plain fill loses nothing) -- so only these two get a flag
  mnar_indicator_sources: ["priors_count", "c_charge_degree"]
  # seed for the target encoder's internal cross-fitting (sklearn's TargetEncoder)
  random_state: 42
  imputation:
    # week 10 -- options: median | mean | knn | iterative | random_forest (applies to the numeric
    # columns, which are scaled first, then imputed). knn fills a gap from the n_neighbors most
    # similar rows; iterative = MICE (one completed dataset); random_forest = the missForest idea.
    # None of them uses the target, so they also run on new people (see README "Missing values").
    numeric_strategy: "median"
    n_neighbors: 5                  # knn
    max_iter: 10                    # iterative, random_forest
    n_estimators: 50                # random_forest (trees per column)
    categorical_strategy: "most_frequent"   # applies to sex, c_charge_degree

model:
  # one of: dummy (majority-class floor) | logistic_regression | naive_bayes | decision_tree |
  #         random_forest | oblique_random_forest | adaboost | gradient_boosting | hist_gradient_boosting
  # class_weight: balanced re-weights the loss so both classes count equally (not available for
  # naive_bayes, adaboost, gradient_boosting). It is a per-model param, e.g.:
  #   type: "logistic_regression"
  #   params: {max_iter: 2000, class_weight: balanced}
  # Other examples:
  #   type: "dummy"                  params: {}
  #   type: "decision_tree"          params: {random_state: 42}
  #   type: "oblique_random_forest"  params: {n_estimators: 100, random_state: 42, n_jobs: -1}
  #   type: "adaboost"               params: {max_depth: 1, n_estimators: 100, random_state: 42}
  #   type: "gradient_boosting"      params: {random_state: 42}
  #   type: "hist_gradient_boosting" params: {random_state: 42}
  #   type: "random_forest"          params: {n_estimators: 300, random_state: 42, n_jobs: -1}
  # XGBoost's equivalent of class_weight is scale_pos_weight = negatives / positives (~1.2 here).
  type: "xgboost"
  params:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 4
    random_state: 42
    n_jobs: -1

# Week 8: learned step between preprocessing and the model: keeps the features that at least
# min_votes of three models (random forest, gradient boosting, L1 logistic regression) choose.
# Fitted inside the Pipeline, so it is re-learned on the training rows of every fold (no leak).
feature_selection:
  enabled: true
  min_votes: 2                                      # 1 (keep almost all) .. 3 (keep only unanimous)
  random_state: 42
  search_space:                                     # tuned together with the model when tuning is on
    select__min_votes: {type: int, low: 1, high: 3}

# Week 5: hyperparameter tuning with Optuna (TPE sampler, seeded). Every trial is scored by
# cross-validating the WHOLE pipeline on the development set with the selection metric. The
# reported number is nested CV: tuning is repeated inside each outer fold, so the score is honest.
tuning:
  enabled: true
  n_trials: 30
  n_splits: 5          # inner CV folds used while tuning
  random_state: 42
  # keys are Pipeline parameter names (step `model__`, the base tree of a bagging/boosting
  # ensemble is `estimator`, the oblique forest's tree has steps `project` and `tree`)
  search_spaces:
    logistic_regression:
      model__C: {type: float, low: 0.0001, high: 100.0, log: true}
    naive_bayes:
      model__var_smoothing: {type: float, low: 1.0e-9, high: 1.0, log: true}
    decision_tree:
      model__max_depth: {type: int, low: 1, high: 20}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__criterion: {type: categorical, choices: ["gini", "entropy"]}
    random_forest:
      model__max_depth: {type: int, low: 2, high: 30}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__max_features: {type: categorical, choices: ["sqrt", 0.5, 1.0]}
    oblique_random_forest:
      model__estimator__tree__max_depth: {type: int, low: 2, high: 30}
      model__estimator__tree__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__estimator__project__n_components: {type: int, low: 3, high: 10}
    adaboost:
      model__estimator__max_depth: {type: int, low: 1, high: 8}
      model__n_estimators: {type: int, low: 25, high: 400, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 1.0, log: true}
    gradient_boosting:
      model__n_estimators: {type: int, low: 25, high: 500, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.5, log: true}
      model__max_depth: {type: int, low: 1, high: 6}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__subsample: {type: float, low: 0.5, high: 1.0}
    hist_gradient_boosting:
      model__max_iter: {type: int, low: 25, high: 500, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.5, log: true}
      model__max_leaf_nodes: {type: int, low: 2, high: 63, log: true}
      model__min_samples_leaf: {type: int, low: 5, high: 200, log: true}
      model__l2_regularization: {type: float, low: 0.000001, high: 10.0, log: true}
    xgboost:
      model__n_estimators: {type: int, low: 50, high: 600, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
      model__max_depth: {type: int, low: 1, high: 8}
      model__min_child_weight: {type: float, low: 1.0, high: 50.0, log: true}
      model__subsample: {type: float, low: 0.5, high: 1.0}
      model__colsample_bytree: {type: float, low: 0.5, high: 1.0}
      model__reg_lambda: {type: float, low: 0.01, high: 10.0, log: true}
      model__reg_alpha: {type: float, low: 0.001, high: 10.0, log: true}
      model__gamma: {type: float, low: 0.0, high: 5.0}

output:
  results_dir: "results"             # each run's full report is saved here as run_<id>.txt
  scoreboard: "results/runs.csv"     # one row per run, to compare models side by side
  model_path: "models/model.joblib"  # the final fitted pipeline, used by predict.py (overwritten each run)
