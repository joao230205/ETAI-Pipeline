# Pipeline configuration.
# Nothing here is hardcoded in the source files below -- everything tunable lives in this one place.

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"          # excluded from model features; reserved for the fairness audit
  extra_audit_columns: ["score_text"]  # kept alongside race for the audit, never used as a feature

  # Explicit feature allowlist (chosen from the EDA's correlation/association
  # analysis -- see README "Preprocessing decisions"):
  #   - decile_score / score_text: excluded -- target leakage (they're COMPAS's
  #     own prediction, Cramer's V 0.93 with each other and the highest
  #     association of anything with the target)
  #   - age_cat: excluded -- Cramer's V 0.88 with age, which carries the same
  #     information without discretizing it away
  #   - id: excluded -- identifier, no predictive meaning
  #   - race: excluded from features on purpose -- see sensitive_attr above
  features:
    - age
    - priors_count
    - juv_fel_count
    - juv_misd_count
    - juv_other_count
    - sex
    - c_charge_degree
    - race

split:
  test_size: 0.2
  random_state: 42

# Comparing before (raw/naive) vs after (cleaned) preprocessing, across both
# models -- main.py loops over every entry here for each dataset variant.
models:
  logistic_regression:
    type: "logistic_regression"
    params:
      max_iter: 1000
  decision_tree:
    type: "decision_tree"
    params:
      max_depth: 1000        # unchanged from week 2 -- still a deliberately weak spot (see README);
      random_state: 42       # this week's fix is the preprocessing, not the tree's own overfitting

output:
  results_dir: "results"   # each run's full report is saved here as a timestamped .txt file
